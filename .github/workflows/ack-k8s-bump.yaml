name: Acknowledge Kubernetes Bump

on:
  issue_comment:
    types: [created]

jobs:
  ack-k8s:
    # Trigger only if comment contains /ack-k8s-minor on a PR
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/ack-k8s-minor')
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
      issues: write
      contents: read

    steps:
      - name: Verify Permission and Update Status
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const username = context.payload.comment.user.login;

            // 1. Verify User Permissions via GH API
            // We check if the user has 'admin', 'maintain', or 'write' permissions.
            let authorized = false;
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username,
              });
              
              const authorizedRoles = ['admin', 'maintain', 'write'];
              if (authorizedRoles.includes(permission.permission)) {
                authorized = true;
              }
            } catch (error) {
              console.log("Error checking user permissions: " + error);
            }

            if (!authorized) {
              console.log(`User ${username} is not authorized.`);
              await github.rest.reactions.createForIssueComment({
                owner,
                repo,
                comment_id: context.payload.comment.id,
                content: '-1',
              });
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.payload.issue.number,
                body: `@${username} You are not authorized to acknowledge this change. Only maintainers with write access can proceed.`
              });
              return;
            }

            // Get PR SHA
            const prNumber = context.payload.issue.number;
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const sha = pr.data.head.sha;

            // Update Status Check
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state: 'success',
              context: 'k8s-version-ack',
              description: `Acknowledged by @${username}`,
              target_url: context.payload.comment.html_url,
            });

            // React with Rocket
            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });
